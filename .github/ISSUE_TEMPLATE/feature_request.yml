name: 功能建议
description: 提出新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景与现有替代方案，便于判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案 / 其他想法
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块（可选）
      options:
        - 亮屏统计 / 趋势
        - 睡眠
        - 专注
        - 提醒 / 通知
        - 限额 / 免打扰
        - 外观 / 个性化
        - 成就 / 目标
        - 备份 / 数据
        - 桌面卡片
        - 其他
